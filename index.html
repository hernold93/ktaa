<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>קטע שכתבתי</title>
<meta name="description" content="מקום לפרסם קטע ולקבל עליו קריאה אמיתית. קהילת כותבים בעברית.">
<meta property="og:title" content="קטע שכתבתי">
<meta property="og:description" content="מקום לפרסם קטע ולקבל עליו קריאה אמיתית.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Frank+Ruhl+Libre:wght@400;500;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   טוקנים
   ============================================================ */
:root{
  /* צבע */
  --paper:      #F5F4F0;
  --paper-2:    #EBE9E3;
  --surface:    #FFFFFF;
  --ink:        #14213D;
  --ink-2:      #2E3853;
  --muted:      #5F677A;
  --line:       #DEDCD5;
  --line-2:     #C9C6BD;
  --mark:       #B23A48;
  --mark-2:     #8E2A36;
  --mark-wash:  #F5E6E7;

  /* טיפוגרפיה */
  --display: 'Suez One', Georgia, serif;
  --serif:   'Frank Ruhl Libre', Georgia, serif;
  --sans:    'Assistant', system-ui, -apple-system, sans-serif;

  /* מידות */
  --read: 33rem;
  --page: 46rem;
  --wide: 60rem;

  --r: 3px;
}

@media (prefers-color-scheme: dark){
  :root{
    --paper:      #101218;
    --paper-2:    #171A22;
    --surface:    #1A1D26;
    --ink:        #EAEAE5;
    --ink-2:      #C6C9D1;
    --muted:      #949AA6;
    --line:       #262A33;
    --line-2:     #363B46;
    --mark:       #E0707C;
    --mark-2:     #EC8C96;
    --mark-wash:  #26191C;
  }
}

/* ============================================================
   בסיס
   ============================================================ */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important;animation:none !important}
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.6;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--mark);outline-offset:3px;border-radius:2px}
::selection{background:var(--mark-wash);color:var(--ink)}
img{max-width:100%}
hr{border:0;border-top:1px solid var(--line);margin:0}

.wrap{max-width:var(--page);margin:0 auto;padding:0 1.5rem}
.wrap-wide{max-width:var(--wide);margin:0 auto;padding:0 1.5rem}
.read{max-width:var(--read)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================
   טיפוגרפיה
   ============================================================ */
h1,h2,h3,h4{margin:0;line-height:1.18;letter-spacing:-.012em;font-weight:700}
h1,h2{font-family:var(--display);font-weight:400;letter-spacing:-.02em}
h3,h4{font-family:var(--serif);font-weight:700}

.t-xxl{font-size:clamp(2.4rem, 7.5vw, 4rem);line-height:1.06}
.t-xl {font-size:clamp(1.9rem, 5vw, 2.6rem);line-height:1.12}
.t-lg {font-size:1.5rem}
.t-md {font-size:1.22rem}

.prose{
  font-family:var(--serif);
  font-size:1.12rem;
  line-height:1.85;
  color:var(--ink-2);
  max-width:var(--read);
}
.lede{
  font-family:var(--serif);
  font-size:1.25rem;
  line-height:1.65;
  color:var(--ink-2);
  max-width:30rem;
  margin:0;
}
.quiet{color:var(--muted);font-size:.9rem}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.u:hover{color:var(--mark)}

/* ============================================================
   כותרת עליונה
   ============================================================ */
header{
  border-bottom:1px solid var(--line);
  background:var(--paper);
  position:sticky;top:0;z-index:50;
}
.bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:1rem;padding:.95rem 0;
}
.brand{
  font-family:var(--display);
  font-size:1.35rem;
  letter-spacing:-.02em;
  white-space:nowrap;
}
.brand:hover{color:var(--mark)}
nav{display:flex;gap:1.1rem;align-items:center;font-size:.93rem;color:var(--muted);flex-wrap:wrap;justify-content:flex-end}
nav a{transition:color .12s}
nav a:hover{color:var(--ink)}
nav .who{color:var(--ink);font-weight:600}
nav .who:hover{color:var(--mark)}

main{min-height:60vh}

/* ============================================================
   דף בית — פתיח
   ============================================================ */
.hero{padding:4.5rem 0 3.5rem}
.hero h1{margin-bottom:1.1rem}
.hero .lede{margin-bottom:2rem}
.hero-actions{display:flex;gap:1rem;align-items:center;flex-wrap:wrap}

/* דוגמית — הקטע האחרון שפורסם */
.specimen{
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:3rem 0;
  margin:0;
}
.specimen .kicker{
  font-size:.85rem;color:var(--muted);margin:0 0 1.2rem;
}
.specimen blockquote{
  margin:0;
  border-inline-start:2px solid var(--mark);
  padding-inline-start:1.4rem;
}
.specimen .text{
  font-family:var(--serif);
  font-size:clamp(1.15rem, 2.6vw, 1.4rem);
  line-height:1.8;
  color:var(--ink);
  white-space:pre-wrap;
  max-width:var(--read);
  margin:0 0 1.1rem;
}
.specimen cite{
  font-style:normal;font-size:.92rem;color:var(--muted);
}
.specimen cite b{color:var(--ink);font-weight:600}

/* דף בית — שלושה צעדים */
.steps{padding:3.5rem 0 1rem}
.steps h2{margin-bottom:2.5rem}
.step{
  display:flex;gap:1.4rem;align-items:flex-start;
  padding:1.6rem 0;border-top:1px solid var(--line);
}
.step:last-child{border-bottom:1px solid var(--line)}
.step .num{
  font-family:var(--display);
  font-size:1.7rem;line-height:1;
  color:var(--mark);
  min-width:1.6rem;
  padding-top:.15rem;
}
.step h3{font-size:1.15rem;margin-bottom:.3rem}
.step p{margin:0;color:var(--muted);font-size:.98rem;max-width:32rem}

/* דף בית — סיום */
.closer{padding:4rem 0 5rem;text-align:start}
.closer h2{margin-bottom:1rem}
.closer p{margin:0 0 2rem}

/* ============================================================
   פיד
   ============================================================ */
.page-head{padding:3rem 0 2rem}
.page-head h1{margin-bottom:.7rem}
.page-head p{margin:0}

.filters{
  display:flex;gap:.5rem;flex-wrap:wrap;
  padding-bottom:2rem;
}
.chip{
  font-family:var(--sans);font-size:.88rem;
  background:none;border:1px solid var(--line-2);color:var(--muted);
  padding:.32rem .85rem;border-radius:100px;cursor:pointer;
  transition:all .12s;
}
.chip:hover{border-color:var(--ink);color:var(--ink);background:none}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.on:hover{background:var(--mark);border-color:var(--mark);color:#fff}

.lead-item{padding:0 0 2.6rem;border-bottom:1px solid var(--line)}
.lead-item h2{font-size:clamp(1.6rem,4vw,2.1rem);margin-bottom:.5rem}
.lead-item .excerpt{
  border-inline-start:2px solid var(--mark);
  padding-inline-start:1.2rem;
  margin:1.2rem 0 1rem;
}

.item{padding:2rem 0;border-bottom:1px solid var(--line)}
.item h3{font-size:1.3rem;margin-bottom:.4rem;font-family:var(--serif)}
.item h3 a{transition:color .12s}
.item h3 a:hover{color:var(--mark)}

.excerpt{
  font-family:var(--serif);
  font-size:1.05rem;line-height:1.8;
  color:var(--ink-2);
  white-space:pre-wrap;
  max-width:var(--read);
  margin:.65rem 0 .75rem;
}

.meta{
  font-size:.85rem;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
  margin:0;
}
.meta .name{color:var(--ink);font-weight:600}
.meta .name:hover{color:var(--mark)}
.dot{opacity:.35}
.tag{
  font-size:.78rem;color:var(--mark);background:var(--mark-wash);
  padding:.14rem .6rem;border-radius:2px;
}

/* ============================================================
   עמוד קטע
   ============================================================ */
.piece{padding:3rem 0 0}
.piece h1{font-size:clamp(1.9rem,5vw,2.7rem);margin-bottom:.7rem}
.piece .body{
  font-family:var(--serif);
  font-size:1.16rem;
  line-height:1.95;
  white-space:pre-wrap;
  margin:2.2rem 0;
  max-width:var(--read);
  color:var(--ink);
}
.piece-tools{
  display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;
  padding-top:.5rem;
}

.fb{padding:0 0 5rem}
.fb-head{margin:0 0 1.8rem}
.fb-head h3{font-size:1.35rem;margin-bottom:.3rem}
.fb-head p{margin:0;font-size:.93rem;color:var(--muted)}

.comment{
  border-inline-start:2px solid var(--mark);
  padding-inline-start:1.1rem;
  margin-bottom:1.8rem;
}
.comment .txt{
  margin:0 0 .5rem;white-space:pre-wrap;
  font-family:var(--serif);
  font-size:1.04rem;line-height:1.75;
  max-width:var(--read);
}

.compose{
  margin-top:2.5rem;padding-top:2rem;
  border-top:1px solid var(--line);
}

/* ============================================================
   טפסים
   ============================================================ */
.form{padding:3rem 0 5rem;max-width:38rem}
.form h1{margin-bottom:2rem}
.field{margin-bottom:1.4rem}
label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:.4rem;font-weight:500}
input,textarea,select{
  width:100%;
  font-family:var(--sans);font-size:1rem;
  color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:var(--r);
  padding:.68rem .85rem;
  transition:border-color .12s;
}
textarea{font-family:var(--serif);font-size:1.1rem;line-height:1.85;resize:vertical;min-height:8rem}
input:focus,textarea:focus,select:focus{border-color:var(--mark);outline:none}
::placeholder{color:var(--muted);opacity:.6}
.hint{font-size:.82rem;color:var(--muted);margin:.4rem 0 0}
.counter{font-size:.8rem;color:var(--muted);text-align:start;margin:.4rem 0 0}

button{
  font-family:var(--sans);font-size:.98rem;font-weight:600;
  cursor:pointer;border:0;border-radius:var(--r);
  background:var(--ink);color:var(--paper);
  padding:.72rem 1.6rem;
  transition:background .12s, color .12s;
}
button:hover{background:var(--mark);color:#fff}
button:disabled{opacity:.45;cursor:default}
button:disabled:hover{background:var(--ink);color:var(--paper)}

button.ghost{
  background:none;color:var(--ink);
  border:1px solid var(--line-2);
}
button.ghost:hover{background:none;border-color:var(--mark);color:var(--mark)}

button.plain{
  background:none;color:var(--muted);padding:0;
  font-size:.88rem;font-weight:400;
  text-decoration:underline;text-underline-offset:3px;
}
button.plain:hover{background:none;color:var(--mark)}

.btn-row{display:flex;gap:.9rem;align-items:center;flex-wrap:wrap;margin-top:.5rem}

.tabs{display:flex;gap:1.8rem;margin-bottom:2.2rem;border-bottom:1px solid var(--line)}
.tabs button{
  background:none;color:var(--muted);
  padding:0 0 .75rem;border-radius:0;font-size:1.02rem;font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tabs button.on{color:var(--ink);border-bottom-color:var(--mark)}
.tabs button:hover{background:none;color:var(--ink)}

/* ============================================================
   הודעות ומצבים
   ============================================================ */
.err{color:var(--mark);font-size:.9rem;margin:.8rem 0 0}
.ok{
  border-inline-start:2px solid var(--mark);
  padding-inline-start:1rem;
  font-size:.95rem;color:var(--ink-2);margin:1.5rem 0 0;
}
.callout{
  border-inline-start:2px solid var(--line-2);
  padding-inline-start:1rem;
  font-size:.95rem;color:var(--muted);
  margin:2.5rem 0 0;
}

.empty{padding:3.5rem 0 5rem}
.empty h2{font-size:1.8rem;margin-bottom:.8rem}
.empty p{
  font-family:var(--serif);font-size:1.12rem;line-height:1.7;
  color:var(--ink-2);max-width:27rem;margin:0 0 2rem;
}

.skeleton{padding:3rem 0}
.sk{
  background:var(--paper-2);border-radius:var(--r);
  height:.85rem;margin-bottom:.7rem;
}
.sk.w1{width:45%;height:1.7rem;margin-bottom:1.2rem}
.sk.w2{width:100%}
.sk.w3{width:88%}
.sk.w4{width:62%;margin-bottom:2.5rem}

/* ============================================================
   תחתית
   ============================================================ */
footer{
  border-top:1px solid var(--line);
  padding:2.2rem 0 3rem;
  font-size:.85rem;color:var(--muted);
  display:flex;gap:1.2rem;flex-wrap:wrap;justify-content:space-between;
}
footer nav{font-size:.85rem}

/* ============================================================
   מסכים קטנים
   ============================================================ */
@media (max-width:640px){
  .hero{padding:3rem 0 2.5rem}
  .specimen{padding:2.2rem 0}
  .steps{padding:2.5rem 0 .5rem}
  .closer{padding:3rem 0 4rem}
  .piece .body{font-size:1.09rem;line-height:1.88}
  .bar{padding:.8rem 0}
  nav{gap:.85rem;font-size:.88rem}
  .brand{font-size:1.2rem}
}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#/">קטע שכתבתי</a>
    <nav id="nav"></nav>
  </div>
</header>

<main id="app"></main>

<footer class="wrap">
  <span>קטע שכתבתי · קהילת כותבים בעברית</span>
  <nav>
    <a href="#/feed">כל הקטעים</a>
    <a href="#/about">על המקום</a>
  </nav>
</footer>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ============================================================
   1. הדבק כאן את שני הערכים מ-Supabase → Settings → API
   ============================================================ */
const SUPABASE_URL = 'https://xxxxxxxx.supabase.co';
const SUPABASE_ANON_KEY = 'הדבק-כאן-את-מפתח-ה-anon';

const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const app = document.getElementById('app');
const nav = document.getElementById('nav');

let me = null;            // { id, pen_name, bio }
let recovering = false;   // האם המשתמש הגיע דרך קישור שחזור סיסמה
let feedFilter = 'הכל';

const GENRES = ['פרוזה','שירה','סיפור קצר','פרק מספר','מחשבה','אחר'];

/* ============================================================
   עזרים
   ============================================================ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const when = ts => new Date(ts).toLocaleDateString('he-IL',
  { day:'numeric', month:'long', year:'numeric' });

const cut = (t, n) => t.length > n ? t.slice(0, n).trimEnd() + '…' : t;

const words = t => t.trim().split(/\s+/).filter(Boolean).length;

const readTime = t => {
  const m = Math.max(1, Math.round(words(t) / 180));
  return m === 1 ? 'דקת קריאה' : `${m} דקות קריאה`;
};

const plural = (n, one, many) =>
  n === 0 ? `אין ${many}` : n === 1 ? one : `${n} ${many}`;

const go = hash => { location.hash = hash; };
const show = html => { app.innerHTML = html; };
const $ = id => document.getElementById(id);

function skeleton(){
  show(`<div class="wrap skeleton">
    <div class="sk w1"></div>
    <div class="sk w2"></div>
    <div class="sk w3"></div>
    <div class="sk w4"></div>
    <div class="sk w2"></div>
    <div class="sk w3"></div>
  </div>`);
}

function errorBox(msg){
  return `<div class="wrap page-head">
    <h1 class="t-xl">משהו לא נטען</h1>
    <p class="prose">${esc(msg)}</p>
    <div class="btn-row"><a href="#/"><button class="ghost">חזרה לדף הבית</button></a></div>
  </div>`;
}

/* ============================================================
   מצב התחברות
   ============================================================ */
async function loadMe(){
  const { data:{ session } } = await db.auth.getSession();
  if (!session){ me = null; return; }
  const { data } = await db.from('profiles')
    .select('id, pen_name, bio').eq('id', session.user.id).single();
  me = data ?? { id: session.user.id, pen_name: 'כותב/ת', bio: '' };
}

function paintNav(){
  nav.innerHTML = me
    ? `<a href="#/feed">קטעים</a>
       <a href="#/new">קטע חדש</a>
       <a class="who" href="#/author/${me.id}">${esc(me.pen_name)}</a>
       <button class="plain" id="out">יציאה</button>`
    : `<a href="#/feed">קטעים</a>
       <a href="#/about">על המקום</a>
       <a href="#/enter" class="who">כניסה</a>`;

  const out = $('out');
  if (out) out.onclick = async () => {
    await db.auth.signOut();
    me = null;
    paintNav();
    go('#/');
    route();
  };
}

db.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY'){
    recovering = true;
    go('#/newpass');
    route();
  }
});

/* ============================================================
   שברי HTML משותפים
   ============================================================ */
function metaLine(p, extra = ''){
  const a = p.profiles;
  return `<p class="meta">
    <a class="name" href="#/author/${a?.id ?? ''}">${esc(a?.pen_name ?? 'כותב/ת')}</a>
    <span class="dot">·</span> ${when(p.created_at)}
    ${p.genre ? `<span class="tag">${esc(p.genre)}</span>` : ''}
    ${extra}
  </p>`;
}

function itemHTML(p, len = 170){
  return `<article class="item">
    <h3><a href="#/piece/${p.id}">${esc(p.title)}</a></h3>
    ${metaLine(p)}
    <div class="excerpt">${esc(cut(p.body, len))}</div>
  </article>`;
}

/* ============================================================
   דף הבית
   ============================================================ */
async function viewHome(){
  skeleton();

  const { data, error } = await db.from('pieces')
    .select('id, title, body, genre, created_at, profiles(id, pen_name)')
    .order('created_at', { ascending:false }).limit(4);

  if (error) return show(errorBox(error.message));

  const latest = data?.[0];
  const more   = (data ?? []).slice(1);

  const specimen = latest ? `
    <section class="specimen">
      <div class="wrap">
        <p class="kicker">הקטע האחרון שפורסם כאן</p>
        <blockquote>
          <div class="text">${esc(cut(latest.body, 380))}</div>
          <cite>
            מתוך <a class="u" href="#/piece/${latest.id}">${esc(latest.title)}</a>,
            מאת <b>${esc(latest.profiles?.pen_name ?? 'כותב/ת')}</b>
          </cite>
        </blockquote>
      </div>
    </section>` : `
    <section class="specimen">
      <div class="wrap">
        <p class="kicker">מה שיופיע כאן</p>
        <blockquote>
          <div class="text">עוד לא פורסם כאן קטע. השורות הראשונות של הקטע הבא שיעלה יופיעו בדיוק במקום הזה, בגודל הזה, לעיני כל מי שנכנס.</div>
          <cite>ממתין לכותב/ת הראשון/ה</cite>
        </blockquote>
      </div>
    </section>`;

  show(`
    <section class="hero wrap">
      <h1 class="t-xxl">קטע שכתבתי</h1>
      <p class="lede">מקום לפרסם קטע ולקבל עליו קריאה אמיתית — לא לייק, קריאה. לכותבים בעברית, מתחילים כוותיקים.</p>
      <div class="hero-actions">
        <a href="${me ? '#/new' : '#/enter'}"><button>פרסמו קטע</button></a>
        <a href="#/feed"><button class="ghost">לקרוא מה יש</button></a>
      </div>
    </section>

    ${specimen}

    <section class="steps wrap">
      <h2 class="t-xl">איך זה עובד</h2>

      <div class="step">
        <div class="num">1</div>
        <div>
          <h3>מעלים קטע</h3>

async function viewFeed(){
  skeleton();

  const { data, error } = await db.from('pieces')
    .select('id, title, body, genre, created_at, profiles(id, pen_name)')
    .order('created_at', { ascending:false }).limit(60);

  if (error) return show(errorBox(error.message));

  if (!data.length) return show(`
    <div class="wrap page-head"><h1 class="t-xl">כל הקטעים</h1></div>
    <div class="wrap empty">
      <h2>הדף עוד ריק</h2>
      <p>אף קטע לא פורסם כאן עדיין. אין מינימום אורך, ולא צריך שיהיה גמור.</p>
      <a href="${me ? '#/new' : '#/enter'}"><button>פרסמו את הראשון</button></a>
    </div>`);

  const present = GENRES.filter(g => data.some(p => p.genre === g));
  const shown = feedFilter === 'הכל' ? data : data.filter(p => p.genre === feedFilter);

  const chips = ['הכל', ...present].map(g =>
    `<button class="chip ${feedFilter === g ? 'on' : ''}" data-g="${esc(g)}">${esc(g)}</button>`
  ).join('');

  const [first, ...rest] = shown;

  show(`
    <div class="wrap page-head">
      <h1 class="t-xl">כל הקטעים</h1>
      <p class="quiet">${plural(data.length, 'קטע אחד', 'קטעים')} · לפי סדר פרסום</p>
    </div>
    <div class="wrap">
      <div class="filters">${chips}</div>

      ${!shown.length ? `<p class="prose">אין קטעים בקטגוריה הזאת עדיין.</p>` : `
        <article class="lead-item">
          <h2><a href="#/piece/${first.id}">${esc(first.title)}</a></h2>
          ${metaLine(first, `<span class="dot">·</span> ${readTime(first.body)}`)}
          <div class="excerpt">${esc(cut(first.body, 400))}</div>
          <a class="u quiet" href="#/piece/${first.id}">להמשך הקריאה</a>
        </article>
        ${rest.map(p => itemHTML(p)).join('')}
      `}
    </div>
  `);

  document.querySelectorAll('.chip').forEach(c => {
    c.onclick = () => { feedFilter = c.dataset.g; viewFeed(); };
  });
}

async function viewPiece(id){
  skeleton();

  const { data:p, error } = await db.from('pieces')
    .select('id, title, body, genre, created_at, author_id, profiles(id, pen_name)')
    .eq('id', id).single();

  if (error || !p) return show(`
    <div class="wrap page-head">
      <h1 class="t-xl">הקטע הזה לא נמצא</h1>
      <p class="prose">אולי הוא נמחק, ואולי הקישור שגוי.</p>
      <div class="btn-row"><a href="#/feed"><button class="ghost">לכל הקטעים</button></a></div>
    </div>`);

  const { data:cs } = await db.from('comments')
    .select('id, body, created_at, author_id, profiles(id, pen_name)')
    .eq('piece_id', id).order('created_at');

  const n = (cs ?? []).length;
  const mine = me && me.id === p.author_id;

  show(`
    <article class="piece wrap">
      <h1>${esc(p.title)}</h1>
      ${metaLine(p, `<span class="dot">·</span> ${readTime(p.body)}`)}
      <div class="body">${esc(p.body)}</div>
      ${mine ? `<div class="piece-tools">
        <a class="u quiet" href="#/edit/${p.id}">עריכה</a>
        <button class="plain" id="del">מחיקה</button>
      </div>` : ''}
    </article>

    <div class="wrap"><hr style="margin:3rem 0"></div>

    <section class="fb wrap">
      <div class="fb-head">
        <h3>${n ? `משוב · ${n}` : 'משוב'}</h3>
        <p>מה עבד, מה צרם, ואיפה איבדתם עניין.</p>
      </div>

      ${n ? cs.map(c => `
        <div class="comment">
          <p class="txt">${esc(c.body)}</p>
          <p class="meta">
            <a class="name" href="#/author/${c.profiles?.id ?? ''}">${esc(c.profiles?.pen_name ?? '')}</a>
            <span class="dot">·</span> ${when(c.created_at)}
          </p>
        </div>`).join('')
        : `<p class="prose" style="margin-bottom:0">עוד לא נכתב כאן משוב.</p>`}

      ${me ? `
        <div class="compose">
          <div class="field">
            <label for="cbody">המשוב שלך</label>
            <textarea id="cbody" rows="4" placeholder="שורה אחת מספיקה. שלוש עוזרות יותר."></textarea>
          </div>
          <p class="err" id="cerr" hidden></p>
          <button id="csend">שליחת משוב</button>
        </div>`
        : `<p class="callout"><a class="u" href="#/enter">היכנסו</a> כדי לכתוב משוב.</p>`}
    </section>
  `);

  const del = $('del');
  if (del) del.onclick = async () => {
    if (!confirm('למחוק את הקטע? אי אפשר לשחזר.')) return;
    const { error } = await db.from('pieces').delete().eq('id', p.id);
    if (error) return alert('המחיקה נכשלה: ' + error.message);
    go('#/feed');
  };

  const send = $('csend');
  if (send) send.onclick = async () => {
    const body = $('cbody').value.trim();
    const err  = $('cerr');
    err.hidden = true;
    if (body.length < 3){
      err.textContent = 'כתבו משהו קודם.'; err.hidden = false; return;
    }
    send.disabled = true;
    const { error } = await db.from('comments')
      .insert({ piece_id: p.id, author_id: me.id, body });
    send.disabled = false;
    if (error){ err.textContent = error.message; err.hidden = false; return; }
    viewPiece(id);
  };
}

/* ============================================================

function viewEnter(mode = 'in'){
  show(`
    <div class="wrap form">
      <div class="tabs">
        <button id="tin" class="${mode === 'in' ? 'on' : ''}">כניסה</button>
        <button id="tup" class="${mode === 'up' ? 'on' : ''}">הרשמה</button>
      </div>

      ${mode === 'up' ? `
        <div class="field">
          <label for="pn">שם כותב/ת</label>
          <input id="pn" maxlength="40" placeholder="השם שיופיע מעל הקטעים שלך">
          <p class="hint">אפשר שם אמיתי, אפשר שם עט. אפשר לשנות אחר כך.</p>
        </div>` : ''}

      <div class="field">
        <label for="em">אימייל</label>
        <input id="em" type="email" autocomplete="email">
      </div>

      <div class="field">
        <label for="pw">סיסמה</label>
        <input id="pw" type="password"
          autocomplete="${mode === 'up' ? 'new-password' : 'current-password'}">
      </div>

      <p class="err" id="err" hidden></p>

      <div class="btn-row">
        <button id="btn">${mode === 'up' ? 'פתיחת חשבון' : 'כניסה'}</button>
        ${mode === 'in' ? `<a href="#/forgot"><button class="plain">שכחתי סיסמה</button></a>` : ''}
      </div>
    </div>
  `);

  $('tin').onclick = () => viewEnter('in');
  $('tup').onclick = () => viewEnter('up');

  $('btn').onclick = async () => {
    const email = $('em').value.trim();
    const password = $('pw').value;
    const err = $('err');
    const btn = $('btn');
    err.hidden = true;

    if (!email){
      err.textContent = 'צריך אימייל.'; err.hidden = false; return;
    }
    if (password.length < 6){
      err.textContent = 'הסיסמה צריכה להיות באורך 6 תווים לפחות.';
      err.hidden = false; return;
    }

    btn.disabled = true;
    let res;
    if (mode === 'up'){
      const pen_name = $('pn').value.trim();
      if (!pen_name){
        err.textContent = 'בחרו שם כותב/ת.';
        err.hidden = false; btn.disabled = false; return;
      }
      res = await db.auth.signUp({ email, password, options:{ data:{ pen_name } } });
    } else {
      res = await db.auth.signInWithPassword({ email, password });
    }
    btn.disabled = false;

    if (res.error){ err.textContent = res.error.message; err.hidden = false; return; }

    await loadMe();
    paintNav();
    go('#/');
  };
}

      err.textContent = 'צריך אימייל.'; err.hidden = false; return;
    }

    btn.disabled = true;
    const { error } = await db.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + location.pathname
    });
    btn.disabled = false;

    if (error){ err.textContent = error.message; err.hidden = false; return; }
    ok.hidden = false;
  };
}

/* ============================================================
   קביעת סיסמה חדשה
   ============================================================ */
function viewNewPass(){
  show(`
    <div class="wrap form">
      <h1 class="t-xl">סיסמה חדשה</h1>

      <div class="field">
        <label for="pw">הסיסמה החדשה</label>
        <input id="pw" type="password" autocomplete="new-password">
      </div>

      <p class="err" id="err" hidden></p>
      <div class="btn-row"><button id="btn">שמירה</button></div>
    </div>
  `);

  $('btn').onclick = async () => {
    const password = $('pw').value;
    const err = $('err'), btn = $('btn');
    err.hidden = true;

    if (password.length < 6){
      err.textContent = 'הסיסמה צריכה להיות באורך 6 תווים לפחות.';
      err.hidden = false; return;
    }

    btn.disabled = true;
    const { error } = await db.auth.updateUser({ password });
    btn.disabled = false;

    if (error){ err.textContent = error.message; err.hidden = false; return; }

    recovering = false;
    await loadMe();
    paintNav();
    go('#/');
  };
}

/* ============================================================
   ניתוב
   ============================================================ */
function route(){
  const [, seg, arg] = (location.hash || '#/').split('/');
  window.scrollTo(0, 0);

  if (recovering && seg !== 'newpass') return viewNewPass();

  switch (seg){
    case '':        return viewHome();
    case 'feed':    return viewFeed();
    case 'about':   return viewAbout();
    case 'piece':   return viewPiece(arg);
    case 'author':  return viewAuthor(arg);
    case 'new':     return viewNew();
    case 'edit':    return viewEdit(arg);
    case 'me':      return viewProfile();
    case 'enter':   return viewEnter('in');
    case 'forgot':  return viewForgot();
    case 'newpass': return viewNewPass();
    default:
      return show(`
        <div class="wrap page-head">
          <h1 class="t-xl">אין כאן דף כזה</h1>
          <p class="prose">הקישור כנראה שגוי.</p>
          <div class="btn-row"><a href="#/"><button class="ghost">לדף הבית</button></a></div>
        </div>`);
  }
}

window.addEventListener('hashchange', route);

await loadMe();
paintNav();
route();
</script>
</body>
</html>
